[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-common"
version = "1.0.0"
description = "Shared KYC pack schema and helpers for the AI Academy starter kit"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.7,<3"]

[tool.setuptools.packages.find]
where = ["."]
include = ["kyc_common*"]
